name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
  # Every commit is authored by people. Claude and other assistants are never an author,
  # committer or co-author here, and a squash merge copies each pull request commit's
  # Co-authored-by trailers into main, so the whole history is read on every run.
  authors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: No Claude or Anthropic author, committer or co-author
        run: |
          if git log --format='%an <%ae>%n%cn <%ce>%n%(trailers:key=Co-authored-by,valueonly)' HEAD | grep -iE 'claude|anthropic'; then
            echo "::error::A commit names Claude or Anthropic as its author, committer or co-author. Rewrite it with a person as the only author."
            exit 1
          fi
