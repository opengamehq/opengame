<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Drift</title></head>
<body style="margin:0;background:#101828">
<canvas id="c" width="320" height="240"></canvas>
<script>
  const ctx = document.getElementById("c").getContext("2d");
  globalThis.draw = (x, y) => { ctx.fillStyle = "#101828"; ctx.fillRect(0, 0, 320, 240); ctx.fillStyle = "#5cd6c1"; ctx.fillRect(x % 320, y, 12, 12); };
</script>
<script type="module">
  import { tick } from "./game.js";
  let last = performance.now();
  requestAnimationFrame(function frame(now) { tick((now - last) / 1000); last = now; requestAnimationFrame(frame); });
</script>
</body>
</html>
